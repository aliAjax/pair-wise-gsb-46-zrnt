<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>急救车调度与空地转运分流</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 960px; margin: auto; }
    button { padding: .55rem .9rem; cursor: pointer; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: .6rem; }
    h2 { margin-top: 1.6rem; }
  </style>
</head>
<body>
<main>
  <h1>急救车调度与空地转运分流</h1>
  <p>最小演示页。完整业务流程通过README中的JSON接口调用。</p>
  <h2>地面调度</h2>
  <div class="row"><button id="load">加载记录</button><button id="stats">查看状态统计</button></div>
  <h2>空地转运台</h2>
  <div class="row">
    <button id="waiting">候派区任务</button>
    <button id="aircraft">直升机状态</button>
    <button id="hospitals">医院余量</button>
    <button id="airstats">空地统计</button>
  </div>
  <pre id="output">点击上方按钮读取服务状态。</pre>
</main>
<script>
const headers = {"X-User-Id":"demo-admin","X-Role":"admin","X-Org":"demo"};
async function show(path) {
  const response = await fetch(path, {headers});
  const data = await response.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
document.getElementById("load").onclick = () => show("/api/records?limit=20");
document.getElementById("stats").onclick = () => show("/api/stats");
document.getElementById("waiting").onclick = () => show("/api/missions?state=waiting_dispatch");
document.getElementById("aircraft").onclick = () => show("/api/aircraft");
document.getElementById("hospitals").onclick = () => show("/api/hospitals");
document.getElementById("airstats").onclick = () => show("/api/airstats");
</script>
</body>
</html>
